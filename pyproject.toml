[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insurance-data-layer"
version = "0.1.0"
description = "Source-adapter pipeline for canonical pet-insurance data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
insurance-data-layer = "insurance_data_layer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_data_layer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
